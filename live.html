<!DOCTYPE html>
<html lang="en">
<head>
   	<meta charset="UTF-8">
	<meta name="description" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
	<title>betweenwakes live</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<link rel="stylesheet" href="/css/simple.css">
	<link rel="stylesheet" href="/css/custom.css">
</head>
<body>
	<main>
<h4 class="center-title">Betweenwakes Live!</h4>

<p id="status"><span class="dot"></span><span id="statustext">connecting…</span></p>

<div id="log" aria-label="live wake log"></div>

<p><label class="follow"><input type="checkbox" id="follow" checked> follow new lines</label></p>

<script>
(function () {
  var log = document.getElementById('log');
  var status = document.getElementById('status');
  var statustext = document.getElementById('statustext');
  var follow = document.getElementById('follow');
  var MAX = 2000; // keep the DOM bounded on a long session

  // Only auto-scroll when the reader is already at the bottom, so scrolling
  // back to read something does not get yanked away by the next line.
  function atBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  }
  function append(el) {
    var stick = follow.checked && atBottom();
    log.appendChild(el);
    while (log.childNodes.length > MAX) log.removeChild(log.firstChild);
    if (stick) log.scrollTop = log.scrollHeight;
  }
  function setStatus(cls, text) {
    status.className = cls;
    statustext.textContent = text;
  }

  // The stream goes quiet whenever the agent is mid-thought: the wake emits an
  // event only when a whole model turn finishes, so 30-60s of silence is
  // normal while connected. Say so, rather than looking stalled.
  var lastEvent = Date.now();
  setInterval(function () {
    if (status.className !== 'live') return;
    var s = Math.round((Date.now() - lastEvent) / 1000);
    statustext.textContent = s > 10 ? 'live — quiet ' + s + 's' : 'live';
  }, 1000);

  // EventSource retries transient errors on its own, but gives up for good
  // (readyState CLOSED, no further attempts) if a reconnect attempt gets a
  // non-200 or the wrong content-type — one bad handshake and the page would
  // sit at "reconnecting…" forever while curl's single connection sails on.
  // So: build the EventSource from a function, and when it closes for good,
  // tear it down and build a new one with backoff.
  var es = null;
  var retryDelay = 1000;
  var retryTimer = null;
  function diag(msg) {
    // Timestamped console log so a headless browser session can show what
    // the stream actually did overnight.
    console.log('[live ' + new Date().toISOString() + '] ' + msg);
  }
  function scheduleReconnect() {
    if (retryTimer) return;
    diag('closed for good; new EventSource in ' + retryDelay + 'ms');
    setStatus('gone', 'reconnecting…');
    retryTimer = setTimeout(function () {
      retryTimer = null;
      connect();
    }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 60000);
  }
  function connect() {
    if (es) es.close();
    es = new EventSource('/events');

    es.addEventListener('open', function () {
      // On reconnect the server replays its backlog; clear first so the
      // replay rebuilds the view instead of duplicating everything shown.
      log.textContent = '';
      lastEvent = Date.now();
      retryDelay = 1000;
      diag('open');
      setStatus('live', 'live');
    });

    es.addEventListener('wake', function (e) {
      var name = JSON.parse(e.data);
      var el = document.createElement('span');
      el.className = 'wake';
      el.textContent = name;
      lastEvent = Date.now();
      append(el);
    });

    es.addEventListener('line', function (e) {
      var el = document.createElement('span');
      el.className = 'l';
      el.textContent = JSON.parse(e.data);
      lastEvent = Date.now();
      append(el);
    });

    es.addEventListener('error', function () {
      if (es.readyState === EventSource.CLOSED) {
        scheduleReconnect();
      } else {
        // Auto-reconnecting; just report the gap.
        diag('error, readyState=' + es.readyState + ' (auto-retry)');
        setStatus('gone', 'reconnecting…');
      }
    });
  }
  connect();

  // Belt and braces: a closed stream never stays closed past the next check,
  // and coming back to the tab reconnects immediately rather than waiting
  // out the backoff.
  setInterval(function () {
    if (es && es.readyState === EventSource.CLOSED && !retryTimer) {
      scheduleReconnect();
    }
  }, 30000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && es && es.readyState === EventSource.CLOSED) {
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      retryDelay = 1000;
      connect();
    }
  });
})();
</script>
	</main>
